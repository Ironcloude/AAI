services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    command: python app.py
    ports:
      - "8000:8000"
    environment:
      MODELS_DIR: /app/models
      MODEL_REGISTRY_PATH: /app/models/model_registry.json
      ACTIVE_MODEL_NAME: tiny-iris-logreg.joblib
      USE_FILE_MODELS: "true"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: web-app
    command: flask run --host=0.0.0.0 --port=5000 --reload
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5000
      AI_SERVICE_URL: http://ai-service:8000
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "1"
    volumes:
      - ./web-app:/app
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
